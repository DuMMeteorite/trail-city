<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход и регистрация — Тропа и Город</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header" id="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Тропа<span>&amp;</span>Город</a>
      <nav class="nav" id="nav">
        <a href="index.html" class="nav-link">Главная</a>
        <a href="index.html#routes" class="nav-link">Маршруты</a>
        <a href="index.html#about" class="nav-link">О проекте</a>
        <a href="index.html#footer" class="nav-link">Контакты</a>
      </nav>
      <div class="nav-actions">
        <button type="button" class="menu-btn" id="menuBtn" aria-label="Открыть меню">☰</button>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="container">
      <div class="auth-card">
        <!-- Переключатель вкладок -->
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" data-target="loginForm">Вход</button>
          <button type="button" class="auth-tab" data-target="registerForm">Регистрация</button>
        </div>

        <!-- Форма входа -->
        <form class="auth-form active" id="loginForm" novalidate>
          <h2>С возвращением!</h2>
          <p class="auth-subtitle">Войдите, чтобы открыть сохранённые маршруты</p>

          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="name@example.ru" required>
            <span class="error-text" id="loginEmailError"></span>
          </div>

          <div class="form-group">
            <label for="loginPassword">Пароль</label>
            <input type="password" id="loginPassword" placeholder="Минимум 6 символов" required>
            <span class="error-text" id="loginPasswordError"></span>
          </div>

          <div class="form-alert" id="loginGeneralError"></div>

          <button type="submit" class="btn btn-primary btn-full">Войти в аккаунт</button>
        </form>

        <!-- Форма регистрации -->
        <form class="auth-form" id="registerForm" novalidate>
          <h2>Создать аккаунт</h2>
          <p class="auth-subtitle">Зарегистрируйтесь для доступа к личному кабинету</p>

          <div class="form-group">
            <label for="regName">Ваше имя</label>
            <input type="text" id="regName" placeholder="Александр" required>
            <span class="error-text" id="regNameError"></span>
          </div>

          <div class="form-group">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" placeholder="name@example.ru" required>
            <span class="error-text" id="regEmailError"></span>
          </div>

          <div class="form-group">
            <label for="regPassword">Пароль</label>
            <input type="password" id="regPassword" placeholder="Не короче 6 символов" required>
            <span class="error-text" id="regPasswordError"></span>
          </div>

          <div class="form-group">
            <label for="regPasswordConfirm">Подтверждение пароля</label>
            <input type="password" id="regPasswordConfirm" placeholder="Повторите пароль" required>
            <span class="error-text" id="regPasswordConfirmError"></span>
          </div>

          <div class="form-group checkbox-group">
            <input type="checkbox" id="regAgree" required>
            <label for="regAgree">Я согласен с правилами проекта и обработкой данных</label>
          </div>
          <span class="error-text" id="regAgreeError"></span>

          <div class="form-alert" id="regGeneralError"></div>

          <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <p>&copy; 2026 Тропа и Город. Все права защищены.</p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
